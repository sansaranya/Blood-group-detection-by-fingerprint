<!DOCTYPE html>
<html>
<head>
    <title>Predict</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            display: none;
            border-radius: 10px;
        }

        .spinner {
            display: none;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Blood Group App</a>
        
    </div>
</nav>

<div class="container text-center mt-5">
    <div class="card shadow p-4 bg-white">

        <h1 class="mb-3">🩸 Blood Group Predictor</h1>

        <form method="POST" enctype="multipart/form-data" onsubmit="showSpinner()">

            <input class="form-control mb-3" type="file" name="image" accept="image/*" onchange="previewImage(event)" required>

            <!-- Preview -->
            <img id="preview" class="preview-img"/>

            {% if image_path %}
            <script>
                document.getElementById("preview").src = "{{ image_path }}";
                document.getElementById("preview").style.display = "block";
            </script>
            {% endif %}

            <button class="btn btn-primary mt-3">Predict</button>

        

        </form>

        <!-- Spinner -->
        <div class="spinner mt-3" id="loading">
            <div class="spinner-border text-primary"></div>
            <p>Processing image...</p>
        </div>

        {% if prediction %}
            <div class="alert alert-success mt-4">
                Predicted Blood Group: <strong>{{ prediction }}</strong>
            </div>
        {% endif %}

    </div>
</div>

<script>
function previewImage(event) {
    const image = document.getElementById("preview");
    image.src = URL.createObjectURL(event.target.files[0]);
    image.style.display = "block";
}

function showSpinner() {
    document.getElementById("loading").style.display = "block";
}

function clearImage() {
    document.querySelector('input[type="file"]').value = "";
    const image = document.getElementById("preview");
    image.src = "";
    image.style.display = "none";

    const result = document.querySelector(".alert");
    if (result) result.style.display = "none";

    document.getElementById("loading").style.display = "none";
}
</script>

</body>
</html>
